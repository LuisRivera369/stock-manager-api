name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint y tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stock_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stock_manager
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/stock_manager_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      CORS_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Wait for PostgreSQL ready
        run: |
          for i in $(seq 1 30); do
            if pg_isready -U postgres -d stock_manager_test > /dev/null 2>&1; then
              echo "PostgreSQL is ready after $i seconds"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Build de la imagen
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen de produccion
        run: docker build --target production -t stock-manager-api:ci .
